# CI1 (GitHub Actions CI): on every push and pull request, check that the
# TypeScript error count doesn't rise above the recorded baseline
# (tsc-baseline.json, TS0) and run the Jest tests. No secrets; nothing here
# talks to the API or to Claude.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Expo SDK 54 needs Node 20.19+.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript baseline (no new errors)
        run: npm run tsc:check

      - name: Tests
        run: npm run test:ci
